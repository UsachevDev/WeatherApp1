name: Deploy to GitHub Pages

on:
  push:
    branches: [ "sprint-1-task-1" ]   # твоя ветка
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dist
        shell: bash
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/public
          cp -R src/* dist/
          cp -R public/* dist/public/

          # Безопасная правка путей (если совпадений нет — команды просто ничего не сделают)
          # HTML/JS: ../public/ -> ./public/
          find dist -type f \( -name '*.html' -o -name '*.js' \) -print0 \
            | xargs -0 -r sed -i 's#\.\./public/#./public/#g' || true

          # CSS: ../../../public/ -> ../../public/
          find dist -type f -name '*.css' -print0 \
            | xargs -0 -r sed -i 's#\.\./\.\./\.\./public/#\.\./\.\./public/#g' || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
