<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description"
        content="A modern glassmorphism weather app built with vanilla JavaScript. Live conditions, hourly and 7-day forecasts, powered by Open-Meteo." />
    <title>WeatherApp — live weather &amp; forecast</title>

    <link rel="icon" href="../public/images/icons/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.open-meteo.com">
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles/main.css" />
</head>

<body class="page" data-glass="dim">
    <div class="page__bg" aria-hidden="true"></div>
    <div class="page__glow" aria-hidden="true"></div>

    <div id="app" class="app">
        <main class="main" id="main"></main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./scripts/main.js"></script>
</body>

</html>
